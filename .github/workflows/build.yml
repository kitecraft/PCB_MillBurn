name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Major versions that run on Node 24; the v4 line ran on Node 20, which GitHub has deprecated.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PCB_MillBurn.slnx

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors, so a warning fails the build.
        run: dotnet build PCB_MillBurn.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PCB_MillBurn.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Viewport benchmark
        # The Phase 0 acceptance criterion, measured rather than asserted. CPU raster here (no GPU
        # on a CI runner), so this is a lower bound and is reported, not gated.
        run: dotnet run --project src/MillBurn.App/MillBurn.App.csproj -c Release --no-build -- --bench
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
