name: build

on:
  push:
    # Release branches as well as main: a sprint's work lands there for days before it reaches
    # main, and a story that breaks the build should say so then rather than at the release merge.
    # Story branches are not listed because they never leave the machine they were made on — they
    # are squashed in locally, so the release branch is the first place CI can see them.
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# Once the release-to-main PR is open, a push to the release branch triggers this workflow twice
# — once for the push, once for the PR. One run per ref, and a new push cancels the last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Major versions that run on Node 24; the v4 line ran on Node 20, which GitHub has deprecated.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # global.json, not a version literal: otherwise CI installs the newest 10.0.x and never
          # exercises the SDK the pin names.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PCB_MillBurn.slnx

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors, so a warning fails the build.
        run: dotnet build PCB_MillBurn.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PCB_MillBurn.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Viewport benchmark
        # The Phase 0 acceptance criterion, measured rather than asserted. CPU raster here (no GPU
        # on a CI runner), so this is a lower bound and is reported, not gated.
        run: dotnet run --project src/MillBurn.App/MillBurn.App.csproj -c Release --no-build -- --bench
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
